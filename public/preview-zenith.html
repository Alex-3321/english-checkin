<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith v2 · 十年磨剑 · 复合结构样章</title>
<style>
  :root{ --bg:#090B0C; --line:rgba(255,255,255,.07); --text:#EDE7D8; --muted:rgba(237,231,216,.5); --gold:#D4AF37; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    background-image:radial-gradient(circle at 50% 44%, rgba(212,175,55,.12), transparent 55%);
  }
  .stage{position:relative;padding:10px;border:1px solid var(--line);
    background:linear-gradient(180deg,#14181B,#0C0F11);
    box-shadow:0 40px 90px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);}
  .stage svg{display:block}
  .cap{text-align:center}
  .cap .en{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .cap .cn{font-size:20px;font-weight:700;letter-spacing:.12em;margin-top:4px}
  .cap .meta{font-size:11px;letter-spacing:.14em;color:rgba(212,175,55,.8);margin-top:4px}
</style>
</head>
<body>

<div class="stage">
<svg width="380" height="470" viewBox="0 0 300 380">
  <defs>
    <linearGradient id="v2-obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#565656"/><stop offset=".3" stop-color="#2A2A2A"/>
      <stop offset=".62" stop-color="#151515"/><stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="v2-obs2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F2F2F"/><stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="v2-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBE6"/><stop offset=".16" stop-color="#F5D97A"/>
      <stop offset=".4" stop-color="#D4AF37"/><stop offset=".66" stop-color="#96700F"/>
      <stop offset="1" stop-color="#3E2C05"/>
    </linearGradient>
    <linearGradient id="v2-gold2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B4"/><stop offset=".45" stop-color="#C79A26"/>
      <stop offset="1" stop-color="#5C4306"/>
    </linearGradient>
    <linearGradient id="v2-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C4306"/><stop offset=".22" stop-color="#FFEBA6"/>
      <stop offset=".5" stop-color="#D4AF37"/><stop offset=".78" stop-color="#FFEBA6"/>
      <stop offset="1" stop-color="#5C4306"/>
    </linearGradient>
    <radialGradient id="v2-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE9A0" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#D4AF37" stop-opacity=".24"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v2-ring" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D0" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#D4AF37" stop-opacity=".5"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="v2-blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="v2-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="v2-hard" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ④ 光晕 -->
  <ellipse cx="150" cy="186" rx="132" ry="156" fill="url(#v2-halo)" filter="url(#v2-blur)"/>

  <!-- ① 底座（三层台阶 + 发光椭圆环） -->
  <ellipse cx="150" cy="330" rx="112" ry="19" fill="url(#v2-ring)" filter="url(#v2-blur)" opacity=".95"/>
  <polygon points="78,296 222,296 236,316 64,316" fill="url(#v2-obs2)" stroke="url(#v2-edge)" stroke-width="1.4"/>
  <polygon points="64,316 236,316 214,354 86,354" fill="url(#v2-obs)" stroke="url(#v2-edge)" stroke-width="1.4"/>
  <polygon points="64,316 236,316 228,325 72,325" fill="url(#v2-gold)" opacity=".3"/>
  <polygon points="106,325 194,325 184,345 116,345" fill="url(#v2-gold)" opacity=".14" stroke="#8A6612" stroke-width=".9"/>
  <path d="M86 354 L214 354" stroke="#FFE9A0" stroke-width="1" opacity=".5"/>
  <ellipse cx="150" cy="330" rx="66" ry="9" fill="none" stroke="url(#v2-edge)" stroke-width="1.1" opacity=".6"/>

  <!-- 连接柱：把底座和盾体连起来 -->
  <rect x="140" y="262" width="20" height="38" fill="url(#v2-obs2)" stroke="url(#v2-edge)" stroke-width="1.1"/>
  <polygon points="128,258 172,258 164,270 136,270" fill="url(#v2-gold)" stroke="#3A2A06" stroke-width="1" filter="url(#v2-hard)"/>
  <polygon points="132,296 168,296 164,306 136,306" fill="url(#v2-gold2)" opacity=".85"/>

  <!-- ② 外框 -->
  <!-- 护翼（带尖刺） -->
  <polygon points="74,112 20,128 4,176 32,204 68,170" fill="url(#v2-obs)" stroke="url(#v2-edge)" stroke-width="1.4"/>
  <polygon points="226,112 280,128 296,176 268,204 232,170" fill="url(#v2-obs)" stroke="url(#v2-edge)" stroke-width="1.4"/>
  <polygon points="20,128 12,100 38,120" fill="url(#v2-gold)" stroke="#3A2A06" stroke-width="1"/>
  <polygon points="280,128 288,100 262,120" fill="url(#v2-gold)" stroke="#3A2A06" stroke-width="1"/>
  <polygon points="4,176 -2,150 22,166" fill="url(#v2-gold2)" stroke="#3A2A06" stroke-width="1"/>
  <polygon points="296,176 302,150 278,166" fill="url(#v2-gold2)" stroke="#3A2A06" stroke-width="1"/>
  <path d="M32 138 L52 178 M268 138 L248 178" stroke="url(#v2-edge)" stroke-width="1.2" opacity=".8"/>

  <!-- 盾体（双层描边） -->
  <polygon points="150,46 230,88 236,178 150,292 64,178 70,88" fill="url(#v2-obs)" stroke="#000" stroke-width="2.4"/>
  <polygon points="150,46 230,88 236,178 150,292 64,178 70,88" fill="none" stroke="url(#v2-edge)" stroke-width="1.6"/>
  <polygon points="150,64 218,98 223,174 150,272 77,174 82,98" fill="url(#v2-obs2)" stroke="#C79B2E" stroke-width="1.1"/>
  <polygon points="150,64 218,98 150,98" fill="#6A6A6A" opacity=".32"/>
  <polygon points="150,272 77,174 150,174" fill="#000" opacity=".5"/>
  <path d="M150 64 L150 98 M82 98 L218 98" stroke="#E9C559" stroke-width=".8" opacity=".3"/>

  <!-- 顶部尖角（五根） -->
  <polygon points="150,4 168,66 132,66" fill="url(#v2-gold)" stroke="#2A1D06" stroke-width="1.2" filter="url(#v2-hard)"/>
  <polygon points="108,18 126,72 96,72" fill="url(#v2-gold2)" stroke="#2A1D06" stroke-width="1.1"/>
  <polygon points="192,18 204,72 174,72" fill="url(#v2-gold2)" stroke="#2A1D06" stroke-width="1.1"/>
  <polygon points="86,44 100,78 78,78" fill="url(#v2-gold2)" stroke="#2A1D06" stroke-width="1" opacity=".9"/>
  <polygon points="214,44 222,78 200,78" fill="url(#v2-gold2)" stroke="#2A1D06" stroke-width="1" opacity=".9"/>
  <!-- 肩甲 -->
  <polygon points="70,88 106,102 80,122" fill="url(#v2-gold)" opacity=".5"/>
  <polygon points="230,88 194,102 220,122" fill="url(#v2-gold)" opacity=".5"/>

  <!-- ③ 核心：倒立大剑（加长） -->
  <circle cx="150" cy="96" r="8" fill="url(#v2-gold)" stroke="#3A2A06" stroke-width="1.1"/>
  <rect x="142" y="102" width="16" height="34" fill="url(#v2-obs2)" stroke="#C79B2E" stroke-width="1"/>
  <polygon points="100,136 200,136 190,156 110,156" fill="url(#v2-gold)" stroke="#2A1D06" stroke-width="1.3" filter="url(#v2-hard)"/>
  <polygon points="110,156 190,156 150,172" fill="url(#v2-gold2)" opacity=".9"/>
  <!-- 护手两端上翘 -->
  <polygon points="100,136 88,122 104,130" fill="url(#v2-gold2)" stroke="#2A1D06" stroke-width=".9"/>
  <polygon points="200,136 212,122 196,130" fill="url(#v2-gold2)" stroke="#2A1D06" stroke-width=".9"/>
  <!-- 剑身 -->
  <polygon points="150,282 174,158 150,146 126,158" fill="url(#v2-gold)" stroke="#2A1D06" stroke-width="1.3" filter="url(#v2-soft)"/>
  <polygon points="150,282 174,158 150,158" fill="#FFF6D6" opacity=".4"/>
  <polygon points="150,282 126,158 150,158" fill="#7A5A0E" opacity=".55"/>
  <path d="M150 162 L150 268" stroke="#FFF8DC" stroke-width="1.1" opacity=".75"/>
  <polygon points="150,282 160,252 140,252" fill="#FFFBE6" opacity=".9" filter="url(#v2-soft)"/>
  <!-- 16 切面宝石 -->
  <g filter="url(#v2-hard)">
    <polygon points="150,180 162,196 150,212 138,196" fill="url(#v2-gold2)" stroke="#FFF3C4" stroke-width=".9"/>
    <polygon points="150,180 162,196 150,196" fill="#FFFCE8" opacity=".75"/>
    <polygon points="150,212 138,196 150,196" fill="#6B4E08" opacity=".8"/>
  </g>
</svg>
</div>

<div class="cap">
  <div class="en">Zenith · v2</div>
  <div class="cn">十年磨剑</div>
  <div class="meta">3800 分 · 最高段位</div>
</div>

</body>
</html>
